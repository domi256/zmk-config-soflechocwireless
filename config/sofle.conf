# --- DISPLAY EINSTELLUNGEN ---
CONFIG_ZMK_DISPLAY=y
# Verwendet einen eigenen Thread für das Display, um Lags beim Tippen zu vermeiden
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
# Zeigt den Batteriestand in Prozent an (statt nur als Icon)
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=n
# Zeigt an, ob du mit USB oder Bluetooth (und welches Profil) verbunden bist
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
# Zeigt den Namen des aktuell aktiven Layers an
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
# Zeigt die Anschlagsgeschwindigkeit (WPM) - optional, kann mit # deaktiviert werden
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# --- ENCODER EINSTELLUNGEN ---
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- RGB / LED EINSTELLUNGEN ---
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Erlaubt dem OLED weiterzulaufen, auch wenn RGB ausgeschaltet wird
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Schaltet RGB automatisch aus, wenn das Gerät im Leerlauf ist (schont den Akku)
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# --- POWER MANAGEMENT ---
# Ermöglicht tiefen Schlafmodus nach 30 Minuten Inaktivität
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Batterie-Reporting über Bluetooth an das Betriebssystem
CONFIG_ZMK_BATTERY_REPORTING=y